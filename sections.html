<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — NeonForge 3D</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="section-page">
  <header>
    <nav class="navbar">
      <a class="logo" href="index.html">Neon<span>Forge</span> 3D</a>
      <div class="nav-links">
        <a href="index.html#categories">Разделы</a>
        <a href="index.html#printers">Наши принтеры</a>
        <a href="index.html#benefits">Почему мы</a>
        <a href="index.html#registration">Бонусы</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="section-header">
      <span class="badge" id="category-breadcrumb">Каталог</span>
      <h1 id="category-title">Все изделия</h1>
      <p id="category-description">Выберите раздел, настройте фильтры и оформите заказ напрямую через мессенджер — мы ответим в течение часа.</p>
    </section>

    <section class="filters" aria-label="Фильтр товаров">
      <label>
        Цена от (₽)
        <input type="number" id="min-price" placeholder="0" min="0">
      </label>
      <label>
        Цена до (₽)
        <input type="number" id="max-price" placeholder="50000" min="0">
      </label>
      <label>
        Вид товара
        <select id="type-filter">
          <option value="all">Все виды</option>
        </select>
      </label>
      <label>
        Сортировка
        <select id="sort-order">
          <option value="popular">По популярности</option>
          <option value="price-asc">Сначала дешёвые</option>
          <option value="price-desc">Сначала дорогие</option>
        </select>
      </label>
    </section>

    <section>
      <div class="product-grid" id="product-grid" aria-live="polite"></div>
    </section>
  </main>

  <div class="toast" id="toast">Спасибо! Мы уже обрабатываем ваш запрос.</div>

  <div class="modal" id="product-info-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="product-info-title">
      <button class="modal-close" type="button" id="product-info-close" aria-label="Закрыть">×</button>
      <h3 id="product-info-title"></h3>
      <p id="product-info-description"></p>
      <ul class="modal-details" id="product-info-details"></ul>
    </div>
  </div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/shop.js" defer></script>
</body>
</html>
