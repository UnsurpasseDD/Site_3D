<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes buildReveal {
        0% {
          transform: scaleY(0.08);
          opacity: 0.35;
          filter: blur(2px);
        }
        10% {
          opacity: 0.9;
          filter: blur(0);
        }
        100% {
          transform: scaleY(1);
          opacity: 1;
          filter: blur(0);
        }
      }

      @keyframes nozzleTraverse {
        0% {
          transform: translate(-42px, 88px);
        }
        18% {
          transform: translate(38px, 52px);
        }
        36% {
          transform: translate(-34px, 20px);
        }
        54% {
          transform: translate(34px, -18px);
        }
        72% {
          transform: translate(-30px, -64px);
        }
        88% {
          transform: translate(26px, -112px);
        }
        100% {
          transform: translate(-22px, -156px);
        }
      }

      @keyframes filamentTrail {
        0% {
          transform: scaleX(0.2);
          opacity: 0;
        }
        16%, 56% {
          transform: scaleX(1);
          opacity: 0.95;
        }
        84% {
          transform: scaleX(0.45);
          opacity: 0.35;
        }
        100% {
          transform: scaleX(0.25);
          opacity: 0;
        }
      }

      @keyframes layerGlow {
        0% {
          opacity: 0;
          transform: translateY(120px);
        }
        40% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
          transform: translateY(-120px);
        }
      }

      @keyframes scanPulse {
        0% {
          opacity: 0.05;
        }
        30% {
          opacity: 0.8;
        }
        100% {
          opacity: 0.1;
        }
      }

      .mask-reveal {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: buildReveal 6.5s cubic-bezier(0.32, 0, 0.68, 1) infinite;
      }

      .printed-object {
        filter: drop-shadow(0 24px 30px rgba(12, 68, 128, 0.55));
      }

      .layer-glow rect {
        transform-box: fill-box;
        transform-origin: center;
        animation: layerGlow 6.5s ease-in-out infinite;
      }

      .print-head {
        transform-box: fill-box;
        transform-origin: center;
        animation: nozzleTraverse 6.5s cubic-bezier(0.37, 0.02, 0.63, 1) infinite;
        filter: drop-shadow(0 12px 22px rgba(60, 199, 255, 0.4));
      }

      .print-trail {
        transform-box: fill-box;
        transform-origin: left center;
        animation: filamentTrail 6.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .print-scan {
        transform-box: fill-box;
        transform-origin: center;
        animation: nozzleTraverse 6.5s cubic-bezier(0.37, 0.02, 0.63, 1) infinite,
          scanPulse 1.4s ease-in-out infinite;
        mix-blend-mode: screen;
      }
    </style>

    <linearGradient id="bgGradient" x1="120" y1="40" x2="840" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#041235"/>
      <stop offset="0.5" stop-color="#102060"/>
      <stop offset="1" stop-color="#060B26"/>
    </linearGradient>

    <linearGradient id="frameGradient" x1="160" y1="120" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="nozzleGradient" x1="480" y1="150" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#37BDF8"/>
    </linearGradient>

    <linearGradient id="objectGradient" x1="480" y1="300" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37BDF8"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="highlightGradient" x1="420" y1="320" x2="540" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#37BDF8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="trailGradient" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#37BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#37BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="plateGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 510) scale(220 70)">
      <stop offset="0" stop-color="#37BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#37BDF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="layerPattern" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect width="12" height="14" fill="#38BDF8" fill-opacity="0.18"/>
      <rect y="8" width="12" height="4" fill="#4ADE80" fill-opacity="0.45"/>
    </pattern>

    <path id="vaseBody" d="M420 326L480 300L540 326L512 412L448 412L420 326Z"/>
    <path id="vaseBase" d="M448 412H512L500 448H460L448 412Z"/>

    <mask id="vaseMask">
      <g class="mask-reveal">
        <use href="#vaseBody" fill="#fff"/>
        <use href="#vaseBase" fill="#fff"/>
      </g>
    </mask>
  </defs>

  <rect width="960" height="640" rx="56" fill="url(#bgGradient)"/>
  <rect x="140" y="100" width="680" height="440" rx="54" stroke="url(#frameGradient)" stroke-width="12" fill="#0B123A" fill-opacity="0.45"/>
  <rect x="190" y="150" width="580" height="340" rx="36" stroke="url(#frameGradient)" stroke-width="6" opacity="0.45"/>
  <rect x="280" y="190" width="400" height="260" rx="22" fill="#0F1C4C" opacity="0.35"/>
  <path d="M260 160C260 148.954 268.954 140 280 140H680C691.046 140 700 148.954 700 160V480C700 491.046 691.046 500 680 500H280C268.954 500 260 491.046 260 480V160Z" stroke="url(#frameGradient)" stroke-width="6" opacity="0.35"/>
  <path d="M420 130C420 118.954 428.954 110 440 110H520C531.046 110 540 118.954 540 130V190H420V130Z" fill="#111B45" stroke="#37BDF8" stroke-width="4"/>

  <g class="print-head">
    <g class="nozzle">
      <path d="M472 190H488L500 290H460L472 190Z" fill="url(#nozzleGradient)" stroke="#37BDF8" stroke-width="4"/>
      <rect x="452" y="290" width="56" height="18" rx="6" fill="#37BDF8" fill-opacity="0.55"/>
      <rect x="464" y="308" width="32" height="10" rx="4" fill="#0F1C4C" opacity="0.65"/>
    </g>
    <rect class="print-trail" x="463" y="306" width="34" height="12" rx="6" fill="url(#trailGradient)"/>
    <rect class="print-scan" x="454" y="302" width="56" height="160" rx="28" fill="url(#scanGradient)" opacity="0.65"/>
  </g>

  <g class="printed-object" mask="url(#vaseMask)">
    <use href="#vaseBody" fill="url(#objectGradient)" stroke="#37BDF8" stroke-width="4"/>
    <use href="#vaseBase" fill="url(#objectGradient)" stroke="#37BDF8" stroke-width="3"/>
    <use href="#vaseBody" fill="url(#layerPattern)" opacity="0.4"/>
    <path d="M480 302C468 312 452 324 446 348C440 372 444 392 452 406" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M480 302C492 312 508 324 514 348C520 372 516 392 508 406" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <g class="layer-lines" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
      <line x1="444" y1="360" x2="516" y2="360"/>
      <line x1="440" y1="340" x2="520" y2="340"/>
      <line x1="436" y1="380" x2="524" y2="380"/>
      <line x1="438" y1="400" x2="522" y2="400"/>
      <line x1="446" y1="420" x2="514" y2="420"/>
    </g>
  </g>

  <g class="layer-glow" mask="url(#vaseMask)" opacity="0.7">
    <rect x="438" y="300" width="84" height="180" rx="28" fill="url(#highlightGradient)"/>
  </g>

  <ellipse cx="480" cy="512" rx="210" ry="60" fill="url(#plateGlow)"/>
  <rect x="360" y="488" width="240" height="18" rx="8" fill="#111B45" stroke="#37BDF8" stroke-width="4"/>
  <rect x="240" y="540" width="480" height="20" rx="10" fill="#111B45" stroke="#37BDF8" stroke-width="4" opacity="0.6"/>
  <path d="M500 160C530 155 560 130 600 120" stroke="#A855F7" stroke-width="8" stroke-linecap="round"/>
  <path d="M600 120C650 110 710 110 720 170" stroke="#37BDF8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="600" cy="120" r="10" fill="#A855F7"/>
  <circle cx="720" cy="170" r="12" fill="#37BDF8"/>

  <circle cx="280" cy="170" r="8" fill="#37BDF8"/>
  <circle cx="680" cy="170" r="8" fill="#37BDF8"/>
  <circle cx="280" cy="470" r="8" fill="#A855F7"/>
  <circle cx="680" cy="470" r="8" fill="#A855F7"/>

  <g opacity="0.4">
    <path d="M220 230H320" stroke="#37BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M220 260H320" stroke="#37BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M220 290H320" stroke="#37BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g opacity="0.4">
    <path d="M640 230H740" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 260H740" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 290H740" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
